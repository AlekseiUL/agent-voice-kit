# Updates are proposals. Review and passing CI are required; no auto-merge.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    actions-compatible:
      patterns: ['*']
      update-types: [minor, patch]
- package-ecosystem: uv
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    tts-compatible:
      patterns: ['edge-tts', 'aiohttp', 'aiohappyeyeballs', 'aiosignal', 'frozenlist', 'multidict', 'propcache', 'yarl']
      update-types: [minor, patch]
