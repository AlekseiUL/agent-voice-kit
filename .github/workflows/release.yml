name: Signed release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test and build
        run: |
          uv sync --extra dev
          uv run pytest
          uv run python scripts/privacy_scan.py
          uv build
      - name: Generate complete CycloneDX runtime SBOM
        run: |
          uv venv .sbom-venv
          uv pip install --python .sbom-venv/bin/python dist/*.whl
          uv run cyclonedx-py environment .sbom-venv/bin/python \
            --pyproject pyproject.toml \
            --mc-type application \
            --output-reproducible \
            --output-format JSON \
            --output-file dist/agent-voice-kit-${{ github.ref_name }}.cyclonedx.json
      - name: Sign build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Sign SBOM attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/agent-voice-kit-${{ github.ref_name }}.cyclonedx.json
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "Agent Voice Kit ${GITHUB_REF_NAME}"
