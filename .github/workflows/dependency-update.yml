name: dependency-update-proposal
on: workflow_dispatch
permissions:
  contents: read
jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv lock --upgrade
      - name: Regenerate audit snapshot from the candidate lock
        run: |
          uv export --locked --all-extras --no-emit-project --no-hashes --output-file "${RUNNER_TEMP}/audit-constraints.txt"
          uv pip compile pyproject.toml requirements-build.in --all-extras --python-version 3.12 --python-platform linux --constraint "${RUNNER_TEMP}/audit-constraints.txt" --no-header --no-annotate --output-file requirements-audit.txt
          uv run --no-project --python 3.12 --with packaging==26.3 python scripts/check_dependency_consistency.py
      - run: git diff -- uv.lock requirements-audit.txt > dependency-update.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-update-required
          path: dependency-update.patch
# This opt-in job creates an artifact only. It never pushes or publishes.
