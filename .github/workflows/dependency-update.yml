name: dependency-update-proposal
on: workflow_dispatch
permissions:
  contents: read
jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv lock --upgrade
      - run: git diff -- uv.lock > dependency-update.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-update-required
          path: dependency-update.patch
# This opt-in job creates an artifact only. It never pushes or publishes.
